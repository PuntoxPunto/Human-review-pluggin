<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    .app { min-height: 520px; display: grid; grid-template-rows: auto 1fr; }
    header { display:flex; gap:12px; align-items:center; padding:10px 12px; border-bottom:1px solid color-mix(in srgb, CanvasText 16%, transparent); }
    .title { min-width:0; flex:1; }
    h1 { font-size:14px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .meta { font-size:11px; opacity:.66; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    button { border:1px solid color-mix(in srgb, CanvasText 20%, transparent); background:color-mix(in srgb, CanvasText 5%, Canvas); color:inherit; border-radius:8px; padding:7px 10px; cursor:pointer; }
    main { min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 280px; }
    .stage { min-width:0; min-height:0; overflow:auto; padding:14px; background:color-mix(in srgb, CanvasText 4%, Canvas); }
    .shot-wrap { position:relative; width:min(100%, 1100px); margin:0 auto; box-shadow:0 8px 28px rgba(0,0,0,.16); background:#fff; }
    #shot { display:block; width:100%; height:auto; }
    #overlay { position:absolute; inset:0; pointer-events:none; }
    .box { position:absolute; border:2px solid currentColor; background:color-mix(in srgb, currentColor 10%, transparent); border-radius:3px; }
    .box.info { color:#3b82f6; } .box.warning { color:#f59e0b; } .box.error { color:#ef4444; } .box.critical { color:#dc2626; }
    aside { min-height:0; overflow:auto; border-left:1px solid color-mix(in srgb, CanvasText 16%, transparent); }
    .rail-head { position:sticky; top:0; z-index:2; background:Canvas; padding:12px; border-bottom:1px solid color-mix(in srgb, CanvasText 12%, transparent); }
    .counts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; font-size:11px; }
    .pill { padding:3px 7px; border-radius:999px; background:color-mix(in srgb, CanvasText 8%, Canvas); }
    #findings { padding:8px; display:grid; gap:7px; }
    .finding { text-align:left; width:100%; padding:9px; border-radius:9px; }
    .finding.active { outline:2px solid currentColor; }
    .finding strong { display:block; font-size:12px; }
    .finding p { font-size:11px; line-height:1.35; margin:5px 0 0; opacity:.72; }
    .finding .severity { margin-top:6px; font-size:10px; text-transform:uppercase; letter-spacing:.04em; opacity:.7; }
    .empty { padding:20px 10px; text-align:center; opacity:.6; font-size:12px; }
    @media (max-width: 760px) { main { grid-template-columns:1fr; grid-template-rows:minmax(300px,1fr) 220px; } aside { border-left:0; border-top:1px solid color-mix(in srgb, CanvasText 16%, transparent); } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title"><h1 id="title">Web Review</h1><div class="meta" id="meta">Waiting for evidence…</div></div>
      <button id="fullscreen" type="button">Fullscreen</button>
    </header>
    <main>
      <section class="stage"><div class="shot-wrap" id="shotWrap"><img id="shot" alt="Captured website viewport" /><div id="overlay"></div></div></section>
      <aside><div class="rail-head"><strong>Findings</strong><div class="counts" id="counts"></div></div><div id="findings"><div class="empty">No evidence loaded.</div></div></aside>
    </main>
  </div>
  <script>/*__WEB_REVIEW_WIDGET_SCRIPT__*/</script>
</body>
</html>
