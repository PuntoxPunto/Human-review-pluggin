<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Human Review</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg, #f5f5f2); color: #171714; }
    button, textarea { font: inherit; }
    .app { min-height: 640px; display: grid; grid-template-rows: auto 1fr; }
    .topbar { display:flex; align-items:center; gap:10px; padding:10px 12px; background:#fff; border-bottom:1px solid #e8e7e1; position:sticky; top:0; z-index:3; }
    .brand { font-weight:700; margin-right:auto; display:flex; align-items:center; gap:8px; }
    .status { font-size:12px; padding:4px 8px; background:#f1f0eb; border-radius:999px; color:#66645d; }
    .btn { border:1px solid #deddd6; background:#fff; color:#1d1c18; border-radius:9px; padding:7px 10px; cursor:pointer; }
    .btn:hover { background:#f6f5f0; }
    .btn.primary { background:#1d1c18; color:#fff; border-color:#1d1c18; }
    .btn.danger { color:#9f2f24; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .workspace { min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 320px; }
    .stage { overflow:auto; padding:18px; display:flex; justify-content:center; align-items:flex-start; }
    .device { width:min(100%, 1200px); min-height:540px; background:white; border:1px solid #dddcd5; border-radius:14px; overflow:hidden; box-shadow:0 12px 36px rgba(0,0,0,.08); transition:width .18s ease; }
    .device.mobile { width:390px; }
    #artifact { width:100%; min-height:620px; border:0; display:block; background:white; }
    .rail { background:#fff; border-left:1px solid #e8e7e1; padding:14px; overflow:auto; }
    .section { margin-bottom:18px; }
    .section h3 { margin:0 0 9px; font-size:13px; }
    .hint { font-size:12px; color:#77746b; line-height:1.45; }
    .composer { display:none; gap:8px; }
    .composer.active { display:grid; }
    textarea { width:100%; min-height:74px; resize:vertical; border:1px solid #d9d7cf; border-radius:9px; padding:9px; background:#fff; color:#171714; }
    .card { border:1px solid #e6e4dd; border-radius:10px; padding:10px; margin:8px 0; background:#fbfaf7; }
    .card strong { display:block; font-size:12px; margin-bottom:5px; }
    .quote { color:#6f6c64; font-size:12px; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .body { font-size:13px; line-height:1.4; }
    .toolbar-row { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
    .empty { color:#8b887f; font-size:12px; padding:10px 0; }
    @media (max-width: 820px) { .workspace { grid-template-columns:1fr; } .rail { border-left:0; border-top:1px solid #e8e7e1; } }
    @media (prefers-color-scheme: dark) {
      body { background:#161613; color:#f3f2ed; }
      .topbar,.rail { background:#1f1f1b; border-color:#33332d; }
      .device { border-color:#3a3933; box-shadow:none; }
      .btn { background:#2a2924; color:#f3f2ed; border-color:#44423a; }
      .btn.primary { background:#f3f2ed; color:#171714; border-color:#f3f2ed; }
      .status,.card { background:#292823; color:#c8c5ba; border-color:#3b3933; }
      textarea { background:#22211d; color:#f3f2ed; border-color:#47453d; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">Human Review <span id="status" class="status">Loading…</span></div>
      <button id="desktop" class="btn" type="button">Desktop</button>
      <button id="mobile" class="btn" type="button">Mobile</button>
      <button id="fullscreen" class="btn" type="button">Fullscreen</button>
      <button id="submit" class="btn primary" type="button">Send changes</button>
    </div>
    <div class="workspace">
      <main class="stage">
        <div id="device" class="device"><iframe id="artifact" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe></div>
      </main>
      <aside class="rail">
        <section class="section">
          <h3>Selected block</h3>
          <div class="toolbar-row">
            <button id="commentSelection" class="btn" disabled type="button">Comment selection</button>
            <button id="commentBlock" class="btn" disabled type="button">Comment block</button>
          </div>
          <div class="toolbar-row">
            <button id="moveUp" class="btn" disabled type="button">Move up</button>
            <button id="moveDown" class="btn" disabled type="button">Move down</button>
            <button id="deleteBlock" class="btn danger" disabled type="button">Delete</button>
          </div>
          <div class="hint">Click a block in the preview to select it. Edit text directly in the page.</div>
        </section>
        <section id="composer" class="section composer">
          <h3>Add comment</h3>
          <div id="composerQuote" class="quote"></div>
          <textarea id="commentText" placeholder="What should ChatGPT change?"></textarea>
          <div class="toolbar-row">
            <button id="saveComment" class="btn primary" type="button">Add comment</button>
            <button id="cancelComment" class="btn" type="button">Cancel</button>
          </div>
        </section>
        <section class="section">
          <h3>Comments <span id="commentCount">0</span></h3>
          <div id="comments"></div>
        </section>
        <section class="section">
          <h3>Direct edits <span id="editCount">0</span></h3>
          <div id="edits"></div>
        </section>
      </aside>
    </div>
  </div>
  <script type="module">/*__WIDGET_SCRIPT__*/</script>
</body>
</html>
