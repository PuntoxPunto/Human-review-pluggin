name: CI

on:
  push:
    branches: ["agent/**"]
  pull_request:
    branches: ["main", "agent/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax checks
        run: npm run check

      - name: Unit, MCP, and browser integration tests
        run: npm test

      - name: External AppDeploy MCP transport probe
        run: node scripts/probe-appdeploy-mcp.mjs
